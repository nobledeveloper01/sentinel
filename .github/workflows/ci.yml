name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18'
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  gates:
    name: Gates and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: python3 -m pip install --quiet Pillow==11.3.0
      - run: pnpm install --frozen-lockfile
      - name: The gates
        run: make gates
      - name: The domain tests, with the reach property
        run: make test
      - name: The app tests, with the contrast pairs
        run: make app-test
      - name: The reach fixture is current
        run: make fixtures && git diff --exit-code -- fixtures/
      - name: The server tests, with the cannot-read proof
        run: make server-test
        env:
          DOTNET: dotnet

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # No setup-android: the image carries the SDK and the action fails on it.
      - run: pnpm install --frozen-lockfile
      - name: Assemble
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS build
    runs-on: macos-15
    needs: gates
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pods
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
        run: |
          xcodebuild \
            -workspace SentinelApp.xcworkspace \
            -scheme SentinelApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build
